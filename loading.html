<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VixScr</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #030303;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 18% 0%, rgba(255,255,255,.10), transparent 28%),
      radial-gradient(circle at 78% 12%, rgba(115,115,255,.11), transparent 30%),
      linear-gradient(180deg, #030303 0%, #000 48%, #050505 100%);
  }
  .logo {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 0 38px rgba(255,255,255,.18);
    margin-bottom: 28px;
  }
  .logo svg {
    width: 30px;
    height: 30px;
    fill: #000;
  }
  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 3px solid rgba(255,255,255,.16);
    border-top-color: rgba(255,255,255,.85);
    animation: spin 0.8s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,.5);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div class="spinner"></div>
  <p class="title">Starting VixScr</p>
  <p class="subtitle">Loading your catalogue...</p>
</body>
</html>
