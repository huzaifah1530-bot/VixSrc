name: Account Service Deploy

on:
  push:
    branches: [codex/vela-account-sync]
    paths:
      - "account/**"
      - ".github/workflows/account-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - name: Check Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEPPER: ${{ secrets.VELA_ACCOUNT_PIN_PEPPER }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$PEPPER" ]; then
            echo "::error::Cloudflare account, API token, and account PIN pepper secrets are required"
            exit 1
          fi
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set PIN pepper
        run: printf '%s' "$PEPPER" | npx wrangler secret put PIN_PEPPER
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEPPER: ${{ secrets.VELA_ACCOUNT_PIN_PEPPER }}
