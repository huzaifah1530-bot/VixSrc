name: Desktop Build

# Builds the Windows installer when the desktop app changes.
# Keep the installer as a workflow artifact. Releases are published separately
# only when explicitly requested.
on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Ship the installer inside a zip. Browsers treat a downloaded .exe (and
      # especially an unsigned one) as suspicious; a zip keeps the raw binary
      # out of the download flow and preserves its signature/metadata intact.
      - name: Zip installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/Vela-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer not found in release/" }
          $zip = "release/Vela-Setup-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Setup-${{ steps.version.outputs.version }}
          path: desktop/release/Vela-Setup-*.zip
          if-no-files-found: error
