name: Desktop Build

# Builds the Windows installer for Vela whenever the desktop app changes.
# The installer is uploaded as a workflow artifact and attached to a GitHub
# release tagged desktop-v<version> (re-uploaded if that version already exists).
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Setup-${{ steps.version.outputs.version }}
          path: desktop/release/Vela-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="desktop-v$VERSION"
          FILE=$(ls release/Vela-Setup-*.exe | head -n 1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Vela Desktop $VERSION" --notes "Windows installer for Vela $VERSION (commit ${GITHUB_SHA::7}). Installing over an existing copy updates it in place; your library and settings are kept." --target "$GITHUB_SHA"
          fi
