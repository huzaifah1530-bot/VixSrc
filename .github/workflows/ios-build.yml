name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-ipa:
    name: Build unsigned .ipa
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 26.x ships the iOS 26 SDK, which is required for the real
      # Liquid Glass APIs (glassEffect / GlassEffectContainer). The runner's
      # default is 16.4 (iOS 18.5 SDK) where those symbols don't exist, and
      # the #if compiler(>=6.2) guard in Theme/GlassStyle.swift would silently
      # compile the app with the .ultraThinMaterial fallback everywhere.
      - name: Select Xcode 26 (iOS 26 SDK, needed for Liquid Glass)
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on this runner. Available Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show toolchain and confirm iOS 26 SDK is present
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/VixScr
        run: xcodegen generate

      - name: Build for iOS (unsigned, no code signing)
        working-directory: ios/VixScr
        run: |
          xcodebuild -project VixScr.xcodeproj \
            -scheme VixScr \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa
        working-directory: ios/VixScr
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/VixScr.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built .app not found at $APP_PATH"
            find build/Build/Products -maxdepth 2 -type d
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p ../../artifacts
          zip -r -X ../../artifacts/VixScr-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VixScr-unsigned-ipa
          path: artifacts/VixScr-unsigned.ipa
          if-no-files-found: error
