name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-ipa:
    name: Build unsigned .ipa
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 27 provides AVPlayerItemSampleBufferOutput for decoded HLS audio.
      - name: Show toolchain and confirm iOS 27 SDK is present
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i "iphoneos"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/VixScr
        run: xcodegen generate

      - name: Build for iOS (unsigned, no code signing)
        working-directory: ios/VixScr
        run: |
          xcodebuild -project VixScr.xcodeproj \
            -scheme VixScr \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa
        working-directory: ios/VixScr
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/VixScr.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built .app not found at $APP_PATH"
            find build/Build/Products -maxdepth 2 -type d
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p ../../artifacts
          zip -r -X ../../artifacts/VixScr-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VixScr-unsigned-ipa
          path: artifacts/VixScr-unsigned.ipa
          if-no-files-found: error
