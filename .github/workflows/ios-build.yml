name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method for signed build'
        required: false
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - development
          - app-store

jobs:
  # Always runs: proves the project compiles. No Apple account needed.
  simulator-build:
    name: Build (Simulator, unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/VixScr
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -1)
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available schemes
        run: xcodebuild -list -project VixScr.xcodeproj

      - name: Pick a valid simulator destination for this scheme
        id: sim
        run: |
          # Ask xcodebuild itself which iOS Simulator destinations are
          # actually valid for this scheme on this runner, instead of
          # guessing a device/OS combo that might not be installed.
          DEST_ID=$(xcodebuild -showdestinations -project VixScr.xcodeproj -scheme VixScr 2>/dev/null \
            | grep -m1 'platform:iOS Simulator' \
            | sed -E 's/.*id:([^,}]+).*/\1/')
          if [ -z "$DEST_ID" ]; then
            echo "::error::No valid iOS Simulator destination found for scheme VixScr"
            xcodebuild -showdestinations -project VixScr.xcodeproj -scheme VixScr
            exit 1
          fi
          echo "Using destination id: $DEST_ID"
          echo "id=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project VixScr.xcodeproj \
            -scheme VixScr \
            -destination "id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/VixScr-simulator-xcodebuild.log"

  # Runs automatically on every push. No Apple account/secrets needed.
  # Builds an UNSIGNED .ipa - install it via AltStore/Sideloadly, which
  # signs it on-device using your free Apple ID at install time.
  unsigned-ipa:
    name: Build Unsigned .ipa (auto-sign on install)
    runs-on: macos-15
    needs: simulator-build
    defaults:
      run:
        working-directory: ios/VixScr
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -1)
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for device
        run: |
          set -o pipefail
          xcodebuild build \
            -project VixScr.xcodeproj \
            -scheme VixScr \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/VixScr-device-xcodebuild.log"

      - name: Package as .ipa
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Xcode did not produce an .app bundle"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Built app is missing $APP_PATH/Info.plist"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VixScr-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VixScr-unsigned-ipa
          path: ios/VixScr/VixScr-unsigned.ipa
          retention-days: 14

  signed-build:
    name: Build & Sign .ipa
    runs-on: macos-15
    needs: simulator-build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ios/VixScr
    env:
      EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -1)
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check required secrets are set
        run: |
          missing=0
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD DEVELOPMENT_TEAM; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::One or more signing secrets are missing. See ios/SIGNING.md for setup instructions."
            exit 1
          fi
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VixScr.xcodeproj \
            -scheme VixScr \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/VixScr.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee "$RUNNER_TEMP/VixScr-archive-xcodebuild.log"

      - name: Write ExportOptions.plist
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/VixScr.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            2>&1 | tee "$RUNNER_TEMP/VixScr-export-xcodebuild.log"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VixScr-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
