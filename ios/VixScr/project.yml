name: VixScr
options:
  bundleIdPrefix: com.vixscr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  VixScr:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VixScr
        excludes:
          - "Info.plist"
    # No `info:` block on purpose. XcodeGen *generates* a plist when `info:` is
    # present, overwriting the hand-written VixScr/Info.plist and silently
    # dropping CFBundleURLTypes (the vixscr:// scheme), NSAppTransportSecurity,
    # UIUserInterfaceStyle and the orientation arrays. Point at the real file
    # via INFOPLIST_FILE instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vixscr.app
        PRODUCT_NAME: VixScr
        INFOPLIST_FILE: VixScr/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    capabilities: []
