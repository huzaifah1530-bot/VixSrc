name: VixScr
options:
  bundleIdPrefix: com.vixscr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VixScr:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VixScr
        excludes:
          - "Info.plist"
    info:
      path: VixScr/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vixscr.app
        PRODUCT_NAME: VixScr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    capabilities: []
