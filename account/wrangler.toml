name = "vela-account"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account", "Directory"]

[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "70001"
  [ratelimits.simple]
  limit = 10
  period = 60
